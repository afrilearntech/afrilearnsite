name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret-9f04d86d42d94833983c3ad86e78d7fe
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_SESSION_COOKIE_SECURE: "True"
      DJANGO_CSRF_COOKIE_SECURE: "True"
      DJANGO_HSTS_SECONDS: "31536000"
      DJANGO_HSTS_INCLUDE_SUBDOMAINS: "True"
      DJANGO_HSTS_PRELOAD: "True"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Django checks and tests
        run: |
          DJANGO_SECURE_SSL_REDIRECT=True python manage.py check --deploy --fail-level WARNING
          DJANGO_SECURE_SSL_REDIRECT=False python manage.py check
          python manage.py test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure deployment SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AFRILEARNSITE_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.AFRILEARNSITE_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/afrilearnsite_deploy
          chmod 600 ~/.ssh/afrilearnsite_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to production
        env:
          SSH_HOST: ${{ secrets.AFRILEARNSITE_HOST }}
          SSH_USER: ${{ secrets.AFRILEARNSITE_USER }}
        run: >-
          ssh -i ~/.ssh/afrilearnsite_deploy
          -o BatchMode=yes
          -o IdentitiesOnly=yes
          -o StrictHostKeyChecking=yes
          "$SSH_USER@$SSH_HOST" deploy
